[project]
name = "pocyeah"
version = "0.2.0"
description = "PocYeah — spec-driven, cross-platform CLI for building repeatable narrated screen-recording PoC demos."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Recording renders its own terminals to video, so it needs a terminal emulator
# (pyte) and an image library (Pillow); pywinpty supplies a PTY on Windows only.
record = [
    "pyte>=0.8",
    "pillow>=9",
    "pywinpty>=2; sys_platform == 'win32'",
]
tts = ["elevenlabs"]              # cloud narration (preferred)
tts-local = ["piper-tts>=1.2"]   # cross-platform on-device fallback (Linux/Windows/macOS)

[project.scripts]
pocyeah = "pocyeah.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pocyeah"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
